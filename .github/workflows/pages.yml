name: Publish BTC/XRP and deploy CRYPTO Dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Leave a buffer after each reporting window opens and avoid the hour boundary.
    - cron: "5 10,16 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "crypto-publish-pages"
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check openpyxl reportlab
      - name: Fetch verified BTC/XRP market data and build daily snapshot
        run: python scripts/publish_intraday.py
      - name: Commit dated snapshots and downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html btc.html xrp.html journal.html archiv.html data/ reports/ archive/ downloads/ btc-current-*.svg xrp-current-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Publish BTC/XRP verified intraday snapshot"
            if ! git push origin HEAD:main; then
              echo "Concurrent update detected; fetching and rebasing once."
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          else
            echo "No new verified snapshot to commit."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public Pages content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          published=$(mktemp)
          trap 'rm -f "$published"' EXIT
          for file in index.html btc.html xrp.html journal.html archiv.html; do
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 15 \
                "${PAGE_URL%/}/$file?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
                --output "$published" && cmp -s "$file" "$published"; then
                echo "Verified public $file"
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo "::error::Public Pages content does not match $file"
                exit 1
              fi
              sleep 5
            done
          done
