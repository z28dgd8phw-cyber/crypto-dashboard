name: BTC XRP verified 16:00 publication 2026-11-01
on:
  push:
    paths:
      - '.github/workflows/crypto-publish-1600-20261101.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Optional PDF and Excel dependencies
        run: python -m pip install --disable-pip-version-check reportlab openpyxl || true
      - name: Fetch verified market data and publish snapshot files
        run: python scripts/publish_1600_20261101.py
      - name: Commit and push report, charts and journal
        run: |
          git config user.name "crypto-dashboard-bot"
          git config user.email "crypto-dashboard-bot@users.noreply.github.com"
          git add index.html btc.html xrp.html journal.html archiv.html data/ archive/2026-11-01/11-11/ archive/2026-11-01/16-00/ reports/ downloads/
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified BTC/XRP 2026-11-01 16:00 snapshot and journal"
          git push origin HEAD:main
