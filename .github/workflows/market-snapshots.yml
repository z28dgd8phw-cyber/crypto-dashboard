name: Market snapshots 10/16 Berlin

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/market-snapshots.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this is a 10/16 Berlin run
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import os, datetime
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo("Europe/Berlin"))
          event=os.environ.get("GITHUB_EVENT_NAME","")
          scheduled=event=="schedule"
          should=(not scheduled) or now.hour in (10,16)
          if scheduled and now.hour==10:
              label="10-00"
              display="10:00 Uhr"
          elif scheduled and now.hour==16:
              label="16-00"
              display="16:00 Uhr"
          else:
              label=f"nachholung-{now:%H-%M}"
              display=f"Nachholung {now:%H:%M} Uhr"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if should else 'false'}\n")
              f.write(f"date={now:%Y-%m-%d}\n")
              f.write(f"label={label}\n")
              f.write(f"display={display}\n")
          PY

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Capture Kraken source data
        if: steps.gate.outputs.run == 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request
          date=os.environ["DATE"]
          out=pathlib.Path("data"); out.mkdir(exist_ok=True)
          urls={
            f"kraken-time-{date}.json":"https://api.kraken.com/0/public/Time",
            f"kraken-ticker-{date}.json":"https://api.kraken.com/0/public/Ticker?pair=XBTUSDT%2CXRPUSDT",
            f"kraken-btc-daily-{date}.json":"https://api.kraken.com/0/public/OHLC?pair=XBTUSDT&interval=1440",
            f"kraken-xrp-daily-{date}.json":"https://api.kraken.com/0/public/OHLC?pair=XRPUSDT&interval=1440",
            f"kraken-btc-30m-{date}.json":"https://api.kraken.com/0/public/OHLC?pair=XBTUSDT&interval=30",
            f"kraken-xrp-30m-{date}.json":"https://api.kraken.com/0/public/OHLC?pair=XRPUSDT&interval=30",
          }
          opener=urllib.request.build_opener()
          opener.addheaders=[("User-Agent","crypto-dashboard-github-action/1.0")]
          for name,url in urls.items():
              with opener.open(url,timeout=30) as r:
                  data=r.read()
              (out/name).write_bytes(data)
              print(name, len(data))
          PY

      - name: Build current charts and daily pages
        if: steps.gate.outputs.run == 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
        shell: bash
        run: |
          python scripts/refresh_kraken.py "$DATE"

      - name: Build journal and PDF
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --quiet reportlab
          python scripts/build_journal.py

      - name: Record intraday snapshot and preserve 10/16 history
        if: steps.gate.outputs.run == 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
          SLOT: ${{ steps.gate.outputs.label }}
          DISPLAY_SLOT: ${{ steps.gate.outputs.display }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, pathlib, html, re, shutil
          root=pathlib.Path(".")
          date=os.environ["DATE"]; slot=os.environ["SLOT"]; display_slot=os.environ["DISPLAY_SLOT"]
          journal=json.loads((root/"data/journal.json").read_text())
          rows=[r for r in journal["records"] if r.get("date")==date]
          captured=journal.get("dailyStatus",{}).get("capturedAt","")
          p=root/"data/intraday-snapshots.json"
          snaps=json.loads(p.read_text()) if p.exists() else {"snapshots":[]}
          snaps["snapshots"]=[s for s in snaps["snapshots"] if not (s.get("date")==date and s.get("slot")==slot)]
          snaps["snapshots"].append({"date":date,"slot":slot,"display":display_slot,"capturedAt":captured,"records":rows})
          snaps["snapshots"].sort(key=lambda s:(s.get("date",""),s.get("capturedAt","")))
          p.write_text(json.dumps(snaps,ensure_ascii=False,indent=2))

          today=[s for s in snaps["snapshots"] if s.get("date")==date]
          base10=next((s for s in today if s.get("slot")=="10-00"),None)
          def fmt(n,coin):
              if n is None: return "–"
              return (f"{n:,.1f}" if coin=="BTC" else f"{n:.4f}").replace(",","X").replace(".",",").replace("X",".")
          body=[]
          for s in today:
              base={r["coin"]:r for r in base10["records"]} if base10 else {}
              for r in sorted(s["records"],key=lambda x:x["coin"]):
                  coin=r["coin"]; neutral=f'{fmt(r.get("pivot"),coin)}–{fmt(r.get("breakout"),coin)}'
                  delta="–"
                  if s.get("slot")=="16-00" and coin in base and base[coin].get("price") and r.get("price"):
                      delta=f'{(r["price"]/base[coin]["price"]-1)*100:+.2f} %'.replace(".",",")
                  body.append(
                    "<tr>"
                    f"<td>{html.escape(s.get('display',s.get('slot','')))}</td>"
                    f"<td><strong>{coin}</strong></td>"
                    f"<td>{fmt(r.get('price'),coin)}</td>"
                    f"<td>{html.escape(r.get('trend',''))}</td>"
                    f"<td>{html.escape(r.get('longZone',''))}</td>"
                    f"<td>{html.escape(neutral)}</td>"
                    f"<td>{html.escape(r.get('shortZone',''))}</td>"
                    f"<td>{html.escape(('> '+fmt(r.get('breakout'),coin)) if r.get('breakout') is not None else '–')}</td>"
                    f"<td>{html.escape(('< '+fmt(r.get('breakdown'),coin)) if r.get('breakdown') is not None else '–')}</td>"
                    f"<td>{html.escape(r.get('targets',''))}</td>"
                    f"<td>{html.escape(delta)}</td>"
                    "</tr>"
                  )
          block='''<!-- INTRADAY SNAPSHOTS START -->
          <section class="section card" id="intraday-snapshots" style="scroll-margin-top:150px">
          <h2>Tages-Snapshots 10 / 16 Uhr</h2>
          <p class="lead muted">Beide Tagesstände bleiben erhalten. Nachholungen werden mit tatsächlicher Abrufzeit gekennzeichnet.</p>
          <div class="table-wrap"><table class="journal-table"><thead><tr>
          <th>Snapshot</th><th>Coin</th><th>Kurs</th><th>Trend</th><th>Long-Zone</th><th>Neutral</th><th>Short-Zone</th><th>Breakout</th><th>Breakdown</th><th>Ziele</th><th>Δ ggü. 10 Uhr</th>
          </tr></thead><tbody>'''+''.join(body)+'''</tbody></table></div></section>
          <!-- INTRADAY SNAPSHOTS END -->'''
          for name in ["index.html","journal.html"]:
              q=root/name
              s=q.read_text()
              if "<!-- INTRADAY SNAPSHOTS START -->" in s:
                  s=re.sub(r'<!-- INTRADAY SNAPSHOTS START -->.*?<!-- INTRADAY SNAPSHOTS END -->',block,s,flags=re.S)
              else:
                  s=s.replace('<div class="footer">',block+'<div class="footer">',1)
              # Avoid a dead XLSX link in the GitHub-native fallback run.
              xlsx=root/"downloads"/f"crypto-journal-{date}.xlsx"
              if not xlsx.exists():
                  s=re.sub(r'<a class="btn" href="downloads/crypto-journal-'+re.escape(date)+r'\.xlsx"[^>]*>Excel herunterladen</a>',
                           '<span class="btn secondary">Excel folgt separat</span>',s)
              q.write_text(s)

          # Snapshot archive is append-only.
          arc=root/"archive"/date/slot
          arc.mkdir(parents=True,exist_ok=True)
          for name in ["index.html","journal.html","btc.html","xrp.html",f"btc-current-{date}.svg",f"xrp-current-{date}.svg"]:
              src=root/name
              if src.exists(): shutil.copy2(src,arc/name)
          (arc/"journal.json").write_text(json.dumps(journal,ensure_ascii=False,indent=2))
          PY

      - name: Commit and publish source state
        if: steps.gate.outputs.run == 'true'
        env:
          DATE: ${{ steps.gate.outputs.date }}
          SLOT: ${{ steps.gate.outputs.label }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish $DATE $SLOT BTC/XRP snapshot"
            git push
          fi

      - name: Setup Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
